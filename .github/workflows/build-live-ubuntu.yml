name: Build Live ISO (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      release_line:
        description: "1. Ubuntu Release Line"
        required: true
        type: choice
        options:
          - jammy
          - noble
          - oracular
          - plucky
      kernel_version:
        description: "2. Kernel Version"
        required: true
        type: choice
        options:
          - distro-default
          - "5.15"
          - "6.1"
          - "6.2"
          - "6.5"
          - "6.6"
          - "6.8"
          - "6.18"
          - "7.0"
          - "7.1"

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            live-build \
            build-essential bc bison flex libssl-dev libelf-dev libdw-dev dwarves \
            ccache git wget xz-utils kmod cpio rsync debhelper fakeroot devscripts \
            gpg gnupg

      - name: Set kernel version
        run: |
          KVER="${{ inputs.kernel_version }}"
          if [ "$KVER" = "distro-default" ]; then
            case "${{ inputs.release_line }}" in
              jammy) KVER="5.15" ;;
              noble|oracular|plucky) KVER="6.8" ;;
            esac
          fi
          echo "KERNEL_VERSION=$KVER" >> $GITHUB_ENV
          echo "Building with kernel version: $KVER"

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-live-ubuntu-${{ inputs.release_line }}-${{ env.KERNEL_VERSION }}-amd64-${{ github.run_id }}
          restore-keys: |
            ccache-live-ubuntu-${{ inputs.release_line }}-${{ env.KERNEL_VERSION }}-amd64-
            ccache-live-ubuntu-${{ inputs.release_line }}-${{ env.KERNEL_VERSION }}-
            ccache-live-ubuntu-${{ inputs.release_line }}-
            ccache-live-ubuntu-

      - name: Build kernel packages
        run: |
          KVER="${{ env.KERNEL_VERSION }}"
          MAJOR="${KVER%%.*}"
          TARBALL_DIR=$(mktemp -d)
          mkdir -p kernel-src
          DOWNLOAD_SUCCESS=false
          for URL in \
            "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${KVER}.tar.xz" \
            "https://mirrors.tuna.tsinghua.edu.cn/kernel/v${MAJOR}.x/linux-${KVER}.tar.xz" \
            "https://mirrors.ustc.edu.cn/kernel/v${MAJOR}.x/linux-${KVER}.tar.xz"; do
            echo "Trying: $URL"
            if wget -q --timeout=180 -O "${TARBALL_DIR}/kernel.tar.xz" "$URL" 2>/dev/null; then
              tar xJf "${TARBALL_DIR}/kernel.tar.xz" -C kernel-src --strip-components=1
              if [ -f kernel-src/Makefile ]; then
                DOWNLOAD_SUCCESS=true
                break
              fi
            fi
          done
          [ "$DOWNLOAD_SUCCESS" = true ] || { echo "ERROR: Failed to download kernel source"; exit 1; }
          cd kernel-src
          make defconfig
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_NONE
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
          ./scripts/config --disable CONFIG_KGDB
          ./scripts/config --disable CONFIG_DEBUG_KERNEL
          ./scripts/config --disable CONFIG_DEBUG_MISC
          ./scripts/config --disable CONFIG_WERROR
          # Remove -Werror from ALL build files to avoid objtool failures with newer GCC
          find tools -type f \( -name 'Makefile' -o -name '*.mk' -o -name '*.build' \) -exec grep -l '\-Werror' {} \; | xargs sed -i 's/-Werror//g'
          # Create wrapper to skip debhelper-compat dependency check
          sudo mv /usr/bin/dpkg-buildpackage /usr/bin/dpkg-buildpackage.real
          cat > /tmp/dpkg-buildpackage << 'WRAPPER'
          #!/bin/bash
          /usr/bin/dpkg-buildpackage.real -d "$@"
          WRAPPER
          chmod +x /tmp/dpkg-buildpackage
          sudo mv /tmp/dpkg-buildpackage /usr/bin/dpkg-buildpackage
          make -j$(nproc) bindeb-pkg LOCALVERSION=-live KDEB_PKGVERSION="${KVER}-1"
          sudo mv /usr/bin/dpkg-buildpackage.real /usr/bin/dpkg-buildpackage
          echo "Kernel packages built:"
          ls -lh ../*.deb

      - name: Disable apt signature verification
        run: |
          # Create apt config to skip signature verification (gpg not available in runner)
          echo 'APT::Get::AllowUnauthenticated "true";' | sudo tee /etc/apt/apt.conf.d/99allow-unauth
          echo 'Acquire::AllowInsecureRepositories "true";' | sudo tee -a /etc/apt/apt.conf.d/99allow-unauth
          sudo apt-get update -qq 2>&1 | tail -5

      - name: Setup live-build
        run: |
          mkdir -p live-build
          cd live-build
          lb config \
            --mode ubuntu \
            --distribution ${{ inputs.release_line }} \
            --architecture amd64 \
            --mirror-bootstrap http://archive.ubuntu.com/ubuntu \
            --mirror-binary http://archive.ubuntu.com/ubuntu \
            --mirror-chroot http://archive.ubuntu.com/ubuntu \
            --mirror-chroot-security http://security.ubuntu.com/ubuntu \
            --mirror-binary-security http://security.ubuntu.com/ubuntu \
            --parent-mirror-bootstrap http://archive.ubuntu.com/ubuntu \
            --parent-mirror-binary http://archive.ubuntu.com/ubuntu \
            --parent-mirror-chroot http://archive.ubuntu.com/ubuntu \
            --parent-mirror-chroot-security http://security.ubuntu.com/ubuntu \
            --parent-mirror-binary-security http://security.ubuntu.com/ubuntu \
            --debian-installer false \
            --archive-areas "main restricted universe multiverse" \
            --apt-source-archives false \
            --apt-recommends false \
            --bootappend-live "boot=live components hostname=ubuntu-live username=live" \
            --memtest none \
            --security true \
            --interactive disabled \
            --win32-loader false \
            --initsystem systemd \
            --checksums md5 \
            --gzip-options "--best" \
            --bootloader syslinux,grub-efi \
            --iso-application "Ubuntu Live" \
            --iso-preparer "kernel- builder" \
            --iso-publisher "https://github.com/poying2018/kernel-" \
            --iso-volume "Ubuntu Live ${{ inputs.release_line }}"
          # Copy live-build config FIRST (overwrites lb config defaults)
          cp -r ../live-build/ubuntu/config/* config/
          # Remove any default package list files created by lb config
          # (they may contain distro-specific packages)
          rm -f config/packages.list.chroot
          rm -f config/package-lists/live.list.chroot
          # Diagnostic: show all package list files
          echo "=== Package list files ==="
          find config/ -name '*.list.chroot' -o -name '*.list.binary' | sort
          # Then add [trusted=yes] to all chroot archive sources
          # (gpg is not available in the GitHub Actions runner chroot)
          for f in config/archives/*.list.chroot*; do
            if [ -f "$f" ]; then
              sed -i 's|^deb |deb [trusted=yes] |g' "$f"
              sed -i 's|^deb-src |deb-src [trusted=yes] |g' "$f"
            fi
          done
          # Do NOT copy kernel debs to config/packages.chroot/ — local repo
          # has permission issues in GitHub Actions. We install them manually
          # after lb chroot instead.

      - name: Build ISO
        run: |
          cd live-build
          # Bootstrap first (creates the base system via debootstrap)
          sudo lb bootstrap
          # Inject fake gpg to bypass signature verification in chroot
          # (gpg is not available in the GitHub Actions runner chroot)
          echo '#!/bin/bash' > /tmp/fake-gpg
          echo 'exit 0' >> /tmp/fake-gpg
          chmod +x /tmp/fake-gpg
          sudo cp /tmp/fake-gpg chroot/usr/bin/gpg
          # Create dummy keyrings so live-build's cp/rm don't fail
          sudo touch chroot/root/local-package-keyring.gpg
          sudo touch chroot/root/local-package-keyring.pub
          sudo touch chroot/root/local-package-keyring.sec
          # Disable apt signature verification inside chroot (fake gpg doesn't provide keys)
          sudo mkdir -p chroot/etc/apt/apt.conf.d
          printf 'APT::Get::AllowUnauthenticated "true";\nAcquire::AllowInsecureRepositories "true";\n' | sudo tee chroot/etc/apt/apt.conf.d/99allow-unauth
          # Ensure all repos in sources.list are trusted (remote only, no local repo)
          sudo sed -i 's|^deb |deb [trusted=yes] |g' chroot/etc/apt/sources.list
          sudo sed -i 's|^deb-src |deb-src [trusted=yes] |g' chroot/etc/apt/sources.list
          # Create dummy ubuntu-keyring package to satisfy dependencies
          # (live-build removes preferences.d files, so Pin-Priority won't work)
          mkdir -p /tmp/dummy-keyring/DEBIAN
          printf 'Package: ubuntu-keyring\nVersion: 9999.99.99\nArchitecture: all\nMaintainer: dummy\nDescription: dummy\nSection: misc\nPriority: optional\n' > /tmp/dummy-keyring/DEBIAN/control
          dpkg-deb --build /tmp/dummy-keyring /tmp/dummy-keyring.deb 2>/dev/null
          sudo cp /tmp/dummy-keyring.deb chroot/tmp/
          sudo chroot chroot dpkg -i /tmp/dummy-keyring.deb 2>/dev/null || true
          # Disable lb_chroot_linux-image since we install kernel manually
          CHROOT_LINUX_IMG=$(sudo find /usr/share/live/build /usr/lib/live/build -name 'chroot_linux-image' -type f 2>/dev/null | head -1)
          if [ -n "$CHROOT_LINUX_IMG" ]; then
            echo "=== Disabling lb_chroot_linux-image at $CHROOT_LINUX_IMG (kernel installed manually) ==="
            sudo cp "$CHROOT_LINUX_IMG" "${CHROOT_LINUX_IMG}.bak"
            echo '# Disabled by Mavis - lb_chroot_linux-image handled manually' | sudo tee "$CHROOT_LINUX_IMG"
          fi
          # Disable lb_chroot_hacks since it creates dangling symlinks and fails on chmod
          # (we handle boot files manually after kernel install)
          # Find chroot_hacks on either Debian (/usr/share) or Ubuntu (/usr/lib)
          CHROOT_HACKS=$(sudo find /usr/share/live/build /usr/lib/live/build -name 'chroot_hacks' -type f 2>/dev/null | head -1)
          if [ -n "$CHROOT_HACKS" ]; then
            echo "=== Disabling lb_chroot_hacks at $CHROOT_HACKS (handled manually) ==="
            sudo cp "$CHROOT_HACKS" "${CHROOT_HACKS}.bak"
            echo 'lb_chroot_hacks() { echo "[Mavis] Skipping lb_chroot_hacks (handled manually)"; }' | sudo tee "$CHROOT_HACKS"
          else
            echo "=== WARNING: chroot_hacks not found, searching... ==="
            sudo find /usr -name 'chroot_hacks' -type f 2>/dev/null
          fi
          # Disable lb_chroot_live-packages since lb bootstrap creates a default
          # live-packages.list.chroot with 'casper' (Ubuntu-only pkg, not on Debian)
          # First, find the file (try multiple patterns and locations)
          CHROOT_LIVE_PKGS=$(sudo find /usr/share/live/build /usr/lib/live/build /usr/libexec/live/build -name '*live-packages*' 2>/dev/null | head -1)
          if [ -z "$CHROOT_LIVE_PKGS" ]; then
            echo "=== WARNING: chroot_live-packages not found, listing all live-build files ==="
            sudo find /usr/share/live/build /usr/lib/live/build /usr/libexec/live/build -type f 2>/dev/null | sort
            # Try to find it anywhere
            CHROOT_LIVE_PKGS=$(sudo find /usr -name '*live-packages*' -type f 2>/dev/null | head -1)
          fi
          if [ -n "$CHROOT_LIVE_PKGS" ]; then
            echo "=== Disabling lb_chroot_live-packages at $CHROOT_LIVE_PKGS ==="
            sudo cp "$CHROOT_LIVE_PKGS" "${CHROOT_LIVE_PKGS}.bak"
            echo '# Disabled by Mavis - lb_chroot_live-packages handled manually' | sudo tee "$CHROOT_LIVE_PKGS"
          else
            echo "=== ERROR: chroot_live-packages not found anywhere! ==="
          fi
          # Diagnostic: check for garbage in config/packages.chroot/
          echo "=== config/packages.chroot/ contents ==="
          ls -la config/packages.chroot/ 2>/dev/null || echo "No packages.chroot dir"
          if [ -d config/packages.chroot/ ]; then
            echo "=== Files in packages.chroot ==="
            find config/packages.chroot/ -type f 2>/dev/null | head -20
            echo "=== File contents ==="
            for f in config/packages.chroot/*; do
              echo "--- $f ---"
              cat "$f" 2>/dev/null | head -20
            done
            echo "=== Cleaning packages.chroot to prevent garbage package names ==="
            sudo rm -rf config/packages.chroot/*
          fi
          # Fix wget to correct Contents-amd64.gz URL (in case lb_chroot_linux-image runs)
          if [ -f /usr/bin/wget ]; then
            sudo mv /usr/bin/wget /usr/bin/wget.real
            cat > /tmp/wget-wrapper << 'WGETEOF'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              */dists/*/Contents-amd64.gz)
                arg=$(echo "$arg" | sed 's#/dists/\([^/]*\)/Contents-amd64.gz#/dists/\1/main/Contents-amd64.gz#')
                ;;
            esac
            args+=("$arg")
          done
          exec /usr/bin/wget.real "${args[@]}"
          WGETEOF
            chmod +x /tmp/wget-wrapper
            sudo mv /tmp/wget-wrapper /usr/bin/wget
          fi
          # Remove dangling symlinks in chroot/boot to prevent lb_chroot_hacks chmod failures
          echo "=== Removing dangling symlinks in chroot/boot ==="
          find chroot/boot/ -type l ! -exec test -e {} \; -delete 2>/dev/null || true
          ls -la chroot/boot/ 2>/dev/null || echo "No boot dir"
          # Remove live-packages.list.chroot (lb bootstrap recreates it with casper)
          # MUST be before lb chroot, not lb binary (lb chroot reads this file)
          # Use sudo because lb bootstrap creates files as root
          echo "=== Removing live-packages.list.chroot (pre-chroot) ==="
          sudo rm -f config/package-lists/live-packages.list.chroot
          echo "=== Package list files (pre-chroot) ==="
          sudo find config/ -name '*.list.chroot' -o -name '*.list.binary' | sort
          # Run chroot stage (installs packages from config/package-lists/)
          sudo lb chroot
          # Install kernel packages manually (avoid local repo permission issues)
          sudo cp /__w/kernel-/kernel-/*.deb chroot/tmp/
          sudo chroot chroot dpkg -i /tmp/*.deb || true
          sudo chroot chroot apt-get install -f -y --allow-unauthenticated 2>/dev/null || true
          # Remove dangling symlinks in chroot/boot before lb binary
          # (lb_chroot_hacks creates initrd.img symlinks that point to non-existent files)
          echo "=== Removing dangling symlinks in chroot/boot (pre-binary) ==="
          find chroot/boot/ -type l ! -exec test -e {} \; -delete 2>/dev/null || true
          ls -la chroot/boot/ 2>/dev/null || echo "No boot dir"
          # Remove live-packages.list.chroot again (lb bootstrap may have recreated it)
          echo "=== Removing live-packages.list.chroot (pre-binary) ==="
          sudo rm -f config/package-lists/live-packages.list.chroot
          echo "=== Package list files (pre-binary) ==="
          sudo find config/ -name '*.list.chroot' -o -name '*.list.binary' | sort
          # Create ISO
          sudo lb binary
          echo "ISO built successfully:"
          ls -lh *.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v5
        with:
          name: live-ubuntu-${{ inputs.release_line }}-${{ env.KERNEL_VERSION }}-amd64
          path: live-build/*.iso
          if-no-files-found: error
          compression-level: 0
