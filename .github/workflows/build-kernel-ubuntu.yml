name: Build Kernel (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "1. Target Architecture"
        required: true
        type: choice
        options:
          - amd64
          - arm64
          - armhf
          - riscv64
      release_line:
        description: "2. Ubuntu Release Line"
        required: true
        type: choice
        options:
          - jammy
          - noble
          - oracular
          - plucky
      kernel_version:
        description: "3. Kernel Version (distro-default uses Ubuntu's default for this release)"
        required: true
        type: choice
        options:
          - distro-default
          - "5.15"
          - "6.2"
          - "6.5"
          - "6.8"
          - "6.18"
          - "7.0"
          - "7.1"
      flavour:
        description: "4. Kernel Flavour"
        required: true
        type: choice
        options:
          - amd64
          - amd64-cloud
          - arm64
          - arm64-cloud
          - rt-amd64
          - liquorix-amd64

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v5

      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev libdw-dev dwarves \
            ccache fakeroot devscripts debhelper dpkg-dev git wget xz-utils kmod cpio rsync lsb-release

      - name: Set architecture mapping
        run: |
          case "${{ inputs.arch }}" in
            amd64)   echo "KERNEL_ARCH=x86_64" >> $GITHUB_ENV ;;
            arm64)   echo "KERNEL_ARCH=arm64" >> $GITHUB_ENV ;;
            armhf)   echo "KERNEL_ARCH=arm" >> $GITHUB_ENV ;;
            riscv64) echo "KERNEL_ARCH=riscv" >> $GITHUB_ENV ;;
          esac

      - name: Install cross-compilation toolchain
        if: inputs.arch != 'amd64'
        run: |
          case "${{ inputs.arch }}" in
            arm64)
              sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
              echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
              ;;
            armhf)
              sudo apt-get install -y -qq gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
              echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> $GITHUB_ENV
              ;;
            riscv64)
              sudo apt-get install -y -qq gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
              echo "CROSS_COMPILE=riscv64-linux-gnu-" >> $GITHUB_ENV
              ;;
          esac

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-${{ inputs.arch }}-${{ inputs.release_line }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}-${{ github.run_id }}
          restore-keys: |
            ccache-ubuntu-${{ inputs.arch }}-${{ inputs.release_line }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}-
            ccache-ubuntu-${{ inputs.arch }}-

      - name: Initialize ccache
        run: |
          mkdir -p ${{ env.CCACHE_DIR }}
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=max_size=${{ env.CCACHE_MAXSIZE }}
          ccache --set-config=compression=${{ env.CCACHE_COMPRESS }}
          ccache -z

      - name: Select kernel source
        run: |
          set -euo pipefail
          RELEASE="${{ inputs.release_line }}"
          KVER="${{ inputs.kernel_version }}"

          # Per-release default version and Launchpad tag mapping
          case "$RELEASE" in
            jammy)
              DEFAULT_VER="5.15"
              case "$KVER" in
                distro-default|5.15) SOURCE_REF="Ubuntu-5.15.0-168.178"; RESOLVED_VERSION="5.15" ;;
                6.2) SOURCE_REF="Ubuntu-hwe-6.2-6.2.0-40.41_22.04.1"; RESOLVED_VERSION="6.2" ;;
                6.5) SOURCE_REF="Ubuntu-hwe-6.5-6.5.0-41.41_22.04.1"; RESOLVED_VERSION="6.5" ;;
                6.8) SOURCE_REF="Ubuntu-lowlatency-hwe-6.8-6.8.0-134.134.1_22.04.1"; RESOLVED_VERSION="6.8" ;;
                *)
                  SOURCE_REF="v${KVER}"; RESOLVED_VERSION="$KVER"
                  SOURCE_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
                  ;;
              esac
              [[ -z "${SOURCE_REPO:-}" ]] && SOURCE_REPO="https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy"
              ;;
            noble)
              DEFAULT_VER="6.8"
              case "$KVER" in
                distro-default|6.8) SOURCE_REF="Ubuntu-6.8.0-57.59"; RESOLVED_VERSION="6.8" ;;
                *)
                  SOURCE_REF="v${KVER}"; RESOLVED_VERSION="$KVER"
                  SOURCE_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
                  ;;
              esac
              [[ -z "${SOURCE_REPO:-}" ]] && SOURCE_REPO="https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/noble"
              ;;
            oracular)
              DEFAULT_VER="6.8"
              case "$KVER" in
                distro-default|6.8) SOURCE_REF="Ubuntu-6.8.0-24.24"; RESOLVED_VERSION="6.8" ;;
                *)
                  SOURCE_REF="v${KVER}"; RESOLVED_VERSION="$KVER"
                  SOURCE_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
                  ;;
              esac
              [[ -z "${SOURCE_REPO:-}" ]] && SOURCE_REPO="https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/oracular"
              ;;
            plucky)
              DEFAULT_VER="6.8"
              case "$KVER" in
                distro-default|6.8) SOURCE_REF="Ubuntu-6.8.0-26.26"; RESOLVED_VERSION="6.8" ;;
                *)
                  SOURCE_REF="v${KVER}"; RESOLVED_VERSION="$KVER"
                  SOURCE_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
                  ;;
              esac
              [[ -z "${SOURCE_REPO:-}" ]] && SOURCE_REPO="https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/plucky"
              ;;
          esac

          echo "Source: $SOURCE_REPO"
          echo "Ref: $SOURCE_REF"
          # Try multiple sources for reliability
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 120
          CLONE_SUCCESS=false
          for attempt in 1 2 3 4 5; do
            echo "Clone attempt $attempt/5..."
            if git clone --depth 1 --branch "$SOURCE_REF" "$SOURCE_REPO" linux-src 2>&1 | tee /tmp/clone.log; then
              if [ -f linux-src/Makefile ]; then
                CLONE_SUCCESS=true
                break
              fi
            fi
            echo "Clone attempt $attempt failed. Waiting before retry..."
            if [ "$attempt" -ge 2 ] && [ "$attempt" -le 3 ]; then
              echo "Trying GitHub mirror..."
              if git clone --depth 1 --branch "$SOURCE_REF" "https://github.com/torvalds/linux.git" linux-src 2>&1 | tee /tmp/clone.log; then
                if [ -f linux-src/Makefile ]; then
                  CLONE_SUCCESS=true
                  break
                fi
              fi
            fi
            if [ "$attempt" -ge 4 ]; then
              echo "Trying Tsinghua mirror..."
              if git clone --depth 1 --branch "$SOURCE_REF" "https://mirrors.tuna.tsinghua.edu.cn/git/linux-stable.git" linux-src 2>&1 | tee /tmp/clone.log; then
                if [ -f linux-src/Makefile ]; then
                  CLONE_SUCCESS=true
                  break
                fi
              fi
            fi
            sleep 10
          done

          if [ "$CLONE_SUCCESS" = false ]; then
            echo "Git clone failed, trying tarball download..."
            KERNEL_VER="${SOURCE_KERNEL_VERSION}"
            MAJOR_VER="${KERNEL_VER%%.*}"
            TARBALL_DIR=$(mktemp -d)
            TARBALL_DOWNLOADED=false
            # Try multiple tarball sources
            for TARBALL_URL in \
              "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR_VER}.x/linux-${KERNEL_VER}.tar.xz" \
              "https://mirrors.tuna.tsinghua.edu.cn/kernel/v${MAJOR_VER}.x/linux-${KERNEL_VER}.tar.xz" \
              "https://github.com/torvalds/linux/archive/refs/tags/v${KERNEL_VER}.tar.gz"; do
              echo "Trying tarball: $TARBALL_URL"
              if wget -q --timeout=120 -O "${TARBALL_DIR}/kernel.tar" "$TARBALL_URL" 2>/dev/null; then
                echo "Tarball downloaded, extracting..."
                mkdir -p linux-src && tar xf "${TARBALL_DIR}/kernel.tar" -C linux-src --strip-components=1 2>/dev/null
                if [ -f linux-src/Makefile ]; then
                  TARBALL_DOWNLOADED=true
                  break
                fi
              fi
            done
            if [ "$TARBALL_DOWNLOADED" = false ]; then
              echo "ERROR: Failed to download kernel source via git or tarball."
              echo "Last clone output:"
              cat /tmp/clone.log 2>/dev/null || echo "(no log available)"
              exit 1
            fi
          fi

          cd linux-src
          if [ ! -f Makefile ]; then
            echo "ERROR: Kernel source Makefile not found. Clone may have failed."
            echo "The tag $SOURCE_REF might not exist yet."
            exit 1
          fi

          echo "KERNEL_SRC_DIR=$(pwd)" >> "$GITHUB_ENV"
          echo "SOURCE_KERNEL_VERSION=$RESOLVED_VERSION" >> "$GITHUB_ENV"
          echo "Source HEAD: $(git log --oneline -1)"
          echo "Kernel version: $(make kernelversion 2>/dev/null || echo 'N/A')"
        timeout-minutes: 20

      - name: Apply RT patches
        if: inputs.flavour == 'rt-amd64'
        continue-on-error: true
        run: |
          cd $KERNEL_SRC_DIR
          KVER="${SOURCE_KERNEL_VERSION}"
          RT_BASE="https://mirrors.edge.kernel.org/pub/linux/kernel/projects/rt"
          for RT_VER in $(seq 20 -1 1); do
            URL="${RT_BASE}/${KVER}/patch-${KVER}-rt${RT_VER}.patch.xz"
            if wget -q --spider "${URL}" 2>/dev/null; then
              wget -q "${URL}" -O /tmp/rt.patch.xz && xz -d /tmp/rt.patch.xz && break
            fi
          done
          if [ -f /tmp/rt.patch ]; then
            git apply --check /tmp/rt.patch 2>/dev/null && git apply /tmp/rt.patch || \
              patch -p1 --forward < /tmp/rt.patch || echo "WARNING: RT patch issues"
          else
            echo "WARNING: No RT patch found for $KVER"
          fi

      - name: Apply Liquorix patches
        if: inputs.flavour == 'liquorix-amd64'
        continue-on-error: true
        run: |
          cd $KERNEL_SRC_DIR
          git clone --depth 1 https://github.com/damentz/liquorix-package.git /tmp/liquorix
          PATCH_FILE=$(find /tmp/liquorix -name "*${SOURCE_KERNEL_VERSION}*" -name "*.patch" 2>/dev/null | head -1)
          if [ -n "$PATCH_FILE" ]; then
            git am "$PATCH_FILE" 2>/dev/null || git am --3way "$PATCH_FILE" 2>/dev/null || echo "WARNING: Liquorix patch issues"
          else
            echo "WARNING: No Liquorix patch for ${SOURCE_KERNEL_VERSION}"
          fi

      - name: Patch Ubuntu debian/ (remove -Werror)
        run: |
          cd $KERNEL_SRC_DIR
          if [ -d debian ]; then
            echo "Patching all debian/ files to remove -Werror..."
            find debian -type f \( -name "*.mk" -o -name "rules" -o -name "*.in" -o -name "*.cfg" -o -name "changelog" \) -exec sed -i 's/-Werror/-Wno-error/g' {} +
            echo "Patched debian/ directory"
            echo "Remaining -Werror references:"
            grep -r 'Werror' debian/ 2>/dev/null || echo "None found"
          else
            echo "No debian/ directory found (upstream source, no patch needed)"
          fi

      - name: Patch compiler version check
        run: |
          cd $KERNEL_SRC_DIR
          if [ -f scripts/gcc-version.sh ]; then
            # Replace gcc-version.sh with a version that always returns a valid version
            # This bypasses the "compiler not supported" error for newer GCC on older kernels
            echo '#!/bin/sh' > scripts/gcc-version.sh
            echo '# Patched for compatibility with newer GCC versions' >> scripts/gcc-version.sh
            echo 'exec "$@" -dumpversion 2>/dev/null | sed "s/\\..*//; s/^/100/; s/$/00/" || echo "120000"' >> scripts/gcc-version.sh
            chmod +x scripts/gcc-version.sh
            echo "Patched scripts/gcc-version.sh for compiler compatibility"
          fi


      - name: Configure kernel
        run: |
          cd $KERNEL_SRC_DIR
          if [ ! -f Makefile ]; then
            echo "ERROR: Makefile not found in $KERNEL_SRC_DIR!"
            ls -la
            exit 1
          fi
          if [ -n "${CROSS_COMPILE:-}" ]; then
            CC="ccache ${CROSS_COMPILE}gcc"
          else
            CC="ccache gcc"
          fi
          make ARCH=$KERNEL_ARCH ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} CC="$CC" defconfig
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_NONE
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
          ./scripts/config --disable CONFIG_KGDB
          ./scripts/config --disable CONFIG_DEBUG_KERNEL
          ./scripts/config --disable CONFIG_DEBUG_MISC
          if [[ "${{ inputs.flavour }}" == *"-cloud" ]]; then
            ./scripts/config --disable CONFIG_DRM
            ./scripts/config --disable CONFIG_SOUND
            ./scripts/config --disable CONFIG_INPUT_JOYSTICK
            ./scripts/config --disable CONFIG_INPUT_TABLET
            ./scripts/config --disable CONFIG_INPUT_TOUCHSCREEN
            ./scripts/config --disable CONFIG_INPUT_MISC
            ./scripts/config --disable CONFIG_VGA_CONSOLE
            ./scripts/config --disable CONFIG_FB
            ./scripts/config --disable CONFIG_VT
            ./scripts/config --disable CONFIG_VT_CONSOLE
            ./scripts/config --disable CONFIG_WIRELESS
            ./scripts/config --disable CONFIG_WLAN
            ./scripts/config --disable CONFIG_BT
            ./scripts/config --disable CONFIG_CFG80211
            ./scripts/config --disable CONFIG_MAC80211
            ./scripts/config --disable CONFIG_MEDIA_SUPPORT
            ./scripts/config --disable CONFIG_HID
            ./scripts/config --disable CONFIG_USB_HID
            ./scripts/config --disable CONFIG_HID_GENERIC
            ./scripts/config --disable CONFIG_INPUT_KEYBOARD
            ./scripts/config --disable CONFIG_INPUT_MOUSE
            ./scripts/config --disable CONFIG_SERIO
            ./scripts/config --disable CONFIG_VT_HW_CONSOLE_BINDING
          fi
          if [[ "${{ inputs.flavour }}" == "rt-amd64" ]]; then
            ./scripts/config --enable CONFIG_PREEMPT_RT
            ./scripts/config --disable CONFIG_PREEMPT_NONE
            ./scripts/config --disable CONFIG_PREEMPT_VOLUNTARY
            ./scripts/config --disable CONFIG_PREEMPT
          fi
          ./scripts/config --disable CONFIG_WERROR
          make ARCH=$KERNEL_ARCH ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} CC="$CC" olddefconfig

      - name: Build kernel
        run: |
          cd $KERNEL_SRC_DIR

          # Set compiler based on target architecture
          if [ -n "${CROSS_COMPILE:-}" ]; then
            CC="ccache ${CROSS_COMPILE}gcc"
          else
            CC="ccache gcc"
          fi

          if [ "${{ inputs.arch }}" != "amd64" ]; then
            echo "Cross-compiling for $KERNEL_ARCH..."
            make -j$(nproc) ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE CC="$CC" KCFLAGS=-Wno-error WERROR=0 LOCALVERSION=-${{ inputs.flavour }} KDEB_PKGVERSION=${SOURCE_KERNEL_VERSION}-1
            make -j$(nproc) ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE CC="$CC" KCFLAGS=-Wno-error=format WERROR=0 LOCALVERSION=-${{ inputs.flavour }} KDEB_PKGVERSION=${SOURCE_KERNEL_VERSION}-1 modules
            if [ "$KERNEL_ARCH" = "arm64" ] || [ "$KERNEL_ARCH" = "arm" ]; then
              make -j$(nproc) ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE CC="$CC" KCFLAGS=-Wno-error=format WERROR=0 LOCALVERSION=-${{ inputs.flavour }} KDEB_PKGVERSION=${SOURCE_KERNEL_VERSION}-1 dtbs
            fi
            echo "Cross-compilation build complete."
          else
            echo "Native build for $KERNEL_ARCH using bindeb-pkg..."
            make -j$(nproc) ARCH=$KERNEL_ARCH CC="$CC" KCFLAGS=-Wno-error=format WERROR=0 LOCALVERSION=-${{ inputs.flavour }} KDEB_PKGVERSION=${SOURCE_KERNEL_VERSION}-1 bindeb-pkg
          fi
        timeout-minutes: 300

      - name: Collect artifacts
        run: |
          cd $KERNEL_SRC_DIR
          ARTIFACT_DIR="${{ github.workspace }}/artifacts"
          mkdir -p $ARTIFACT_DIR

          # Collect .deb packages (native builds only)
          find .. -maxdepth 1 -name "*.deb" -exec cp {} $ARTIFACT_DIR/ \;

          # Collect kernel image
          if [ -f arch/$KERNEL_ARCH/boot/bzImage ]; then
            cp arch/$KERNEL_ARCH/boot/bzImage $ARTIFACT_DIR/
          fi
          if [ -f arch/$KERNEL_ARCH/boot/Image ]; then
            cp arch/$KERNEL_ARCH/boot/Image $ARTIFACT_DIR/
          fi

          # Collect DTBs (ARM builds)
          if [ "$KERNEL_ARCH" = "arm64" ] || [ "$KERNEL_ARCH" = "arm" ]; then
            mkdir -p $ARTIFACT_DIR/dtbs
            find arch/$KERNEL_ARCH/boot/dts -name "*.dtb" -exec cp {} $ARTIFACT_DIR/dtbs/ \;
          fi

          # Collect vmlinux (compressed)
          if [ -f vmlinux ]; then
            xz -z -k -T0 vmlinux && cp vmlinux.xz $ARTIFACT_DIR/
          fi

          # Save config
          cp .config $ARTIFACT_DIR/config-${SOURCE_KERNEL_VERSION}-${{ inputs.flavour }}

          # Collect modules
          make ARCH=$KERNEL_ARCH ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} \
            INSTALL_MOD_PATH=$ARTIFACT_DIR/modules modules_install
          cd $ARTIFACT_DIR/modules && tar cJf ../modules-${SOURCE_KERNEL_VERSION}-${{ inputs.flavour }}-${{ inputs.arch }}.tar.xz .
          cd $ARTIFACT_DIR && rm -rf modules
          ls -lh $ARTIFACT_DIR/


      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kernel-ubuntu-${{ inputs.release_line }}-${{ inputs.kernel_version }}-${{ inputs.arch }}-${{ inputs.flavour }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0