name: Build Live ISO (Debian)

on:
  workflow_dispatch:
    inputs:
      release_line:
        description: "1. Debian Release Line"
        required: true
        type: choice
        options:
          - bookworm
          - trixie
      kernel_version:
        description: "2. Kernel Version"
        required: true
        type: choice
        options:
          - distro-default
          - "6.1"
          - "6.6"
          - "6.12"
          - "6.18"

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            live-build \
            build-essential bc bison flex libssl-dev libelf-dev libdw-dev dwarves \
            ccache git wget xz-utils kmod cpio rsync debhelper fakeroot devscripts \
            gpg gnupg syslinux-utils dpkg-dev

      - name: Set kernel version
        run: |
          KVER="${{ inputs.kernel_version }}"
          if [ "$KVER" = "distro-default" ]; then
            case "${{ inputs.release_line }}" in
              bookworm) KVER="6.1" ;;
              trixie) KVER="6.12" ;;
            esac
          fi
          echo "KERNEL_VERSION=$KVER" >> $GITHUB_ENV
          echo "Building with kernel version: $KVER"

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-live-debian-${{ inputs.release_line }}-${{ env.KERNEL_VERSION }}-amd64-${{ github.run_id }}
          restore-keys: |
            ccache-live-debian-${{ inputs.release_line }}-${{ env.KERNEL_VERSION }}-amd64-
            ccache-live-debian-${{ inputs.release_line }}-${{ env.KERNEL_VERSION }}-
            ccache-live-debian-${{ inputs.release_line }}-
            ccache-live-debian-

      - name: Build kernel packages
        run: |
          KVER="${{ env.KERNEL_VERSION }}"
          MAJOR="${KVER%%.*}"
          TARBALL_DIR=$(mktemp -d)
          mkdir -p kernel-src
          DOWNLOAD_SUCCESS=false
          for URL in \
            "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${KVER}.tar.xz" \
            "https://mirrors.tuna.tsinghua.edu.cn/kernel/v${MAJOR}.x/linux-${KVER}.tar.xz" \
            "https://mirrors.ustc.edu.cn/kernel/v${MAJOR}.x/linux-${KVER}.tar.xz"; do
            echo "Trying: $URL"
            if wget -q --timeout=180 -O "${TARBALL_DIR}/kernel.tar.xz" "$URL" 2>/dev/null; then
              tar xJf "${TARBALL_DIR}/kernel.tar.xz" -C kernel-src --strip-components=1
              if [ -f kernel-src/Makefile ]; then
                DOWNLOAD_SUCCESS=true
                break
              fi
            fi
          done
          [ "$DOWNLOAD_SUCCESS" = true ] || { echo "ERROR: Failed to download kernel source"; exit 1; }
          cd kernel-src
          make defconfig
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_NONE
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
          ./scripts/config --disable CONFIG_KGDB
          ./scripts/config --disable CONFIG_DEBUG_KERNEL
          ./scripts/config --disable CONFIG_DEBUG_MISC
          ./scripts/config --disable CONFIG_WERROR
          # Remove -Werror from ALL build files to avoid objtool failures with newer GCC
          find tools -type f \( -name 'Makefile' -o -name '*.mk' -o -name '*.build' \) -exec grep -l '\-Werror' {} \; | xargs sed -i 's/-Werror//g'
          # Create wrapper to skip debhelper-compat dependency check
          sudo mv /usr/bin/dpkg-buildpackage /usr/bin/dpkg-buildpackage.real
          cat > /tmp/dpkg-buildpackage << 'WRAPPER'
          #!/bin/bash
          /usr/bin/dpkg-buildpackage.real -d "$@"
          WRAPPER
          chmod +x /tmp/dpkg-buildpackage
          sudo mv /tmp/dpkg-buildpackage /usr/bin/dpkg-buildpackage
          make -j$(nproc) bindeb-pkg LOCALVERSION=-live KDEB_PKGVERSION="${KVER}-1"
          sudo mv /usr/bin/dpkg-buildpackage.real /usr/bin/dpkg-buildpackage
          echo "Kernel packages built:"
          ls -lh ../*.deb

      - name: Disable apt signature verification
        run: |
          # Create apt config to skip signature verification (gpg not available in runner)
          echo 'APT::Get::AllowUnauthenticated "true";' | sudo tee /etc/apt/apt.conf.d/99allow-unauth
          echo 'Acquire::AllowInsecureRepositories "true";' | sudo tee -a /etc/apt/apt.conf.d/99allow-unauth
          sudo apt-get update -qq 2>&1 | tail -5

      - name: Setup live-build
        run: |
          mkdir -p live-build
          cd live-build
          lb config \
            --distribution ${{ inputs.release_line }} \
            --architecture amd64 \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-chroot-security http://security.debian.org/debian-security \
            --mirror-binary-security http://security.debian.org/debian-security \
            --parent-mirror-bootstrap http://deb.debian.org/debian \
            --parent-mirror-binary http://deb.debian.org/debian \
            --parent-mirror-chroot http://deb.debian.org/debian \
            --parent-mirror-chroot-security http://security.debian.org/debian-security \
            --parent-mirror-binary-security http://security.debian.org/debian-security \
            --debian-installer false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --apt-source-archives false \
            --apt-recommends false \
            --bootappend-live "boot=live components hostname=debian-live username=live" \
            --memtest none \
            --security true \
            --interactive disabled \
            --win32-loader false \
            --initsystem systemd \
            --checksums md5 \
            --gzip-options "--best" \
            --bootloader syslinux,grub-efi \
            --iso-application "Debian Live" \
            --iso-preparer "kernel- builder" \
            --iso-publisher "https://github.com/poying2018/kernel-" \
            --iso-volume "Debian Live ${{ inputs.release_line }}"
          # Copy live-build config FIRST (overwrites lb config defaults)
          cp -r ../live-build/debian/config/* config/
          # Remove any default package list files created by lb config
          # (they may contain distro-specific packages like linux-generic, casper)
          rm -f config/packages.list.chroot
          rm -f config/package-lists/live.list.chroot
          rm -f config/package-lists/live-packages.list.chroot
          # Diagnostic: show all package list files
          echo "=== Package list files ==="
          find config/ -name '*.list.chroot' -o -name '*.list.binary' | sort
          # Then add [trusted=yes] to all chroot archive sources
          # (gpg is not available in the GitHub Actions runner chroot)
          for f in config/archives/*.list.chroot*; do
            if [ -f "$f" ]; then
              sed -i 's|^deb |deb [trusted=yes] |g' "$f"
              sed -i 's|^deb-src |deb-src [trusted=yes] |g' "$f"
            fi
          done
          # Do NOT copy kernel debs to config/packages.chroot/ — local repo
          # has permission issues in GitHub Actions. We install them manually
          # after lb chroot instead.

      - name: Build ISO
        run: |
          cd live-build
          # Bootstrap first (creates the base system via debootstrap)
          sudo lb bootstrap
          # Inject fake gpg to bypass signature verification in chroot
          # (gpg is not available in the GitHub Actions runner chroot)
          echo '#!/bin/bash' > /tmp/fake-gpg
          echo 'exit 0' >> /tmp/fake-gpg
          chmod +x /tmp/fake-gpg
          sudo cp /tmp/fake-gpg chroot/usr/bin/gpg
          # Create dummy keyrings so live-build's cp/rm don't fail
          sudo touch chroot/root/local-package-keyring.gpg
          sudo touch chroot/root/local-package-keyring.pub
          sudo touch chroot/root/local-package-keyring.sec
          # Disable apt signature verification inside chroot (fake gpg doesn't provide keys)
          sudo mkdir -p chroot/etc/apt/apt.conf.d
          printf 'APT::Get::AllowUnauthenticated "true";\nAcquire::AllowInsecureRepositories "true";\n' | sudo tee chroot/etc/apt/apt.conf.d/99allow-unauth
          # Ensure all repos in sources.list are trusted (remote only, no local repo)
          sudo sed -i 's|^deb |deb [trusted=yes] |g' chroot/etc/apt/sources.list
          sudo sed -i 's|^deb-src |deb-src [trusted=yes] |g' chroot/etc/apt/sources.list
          # Disable lb_chroot_linux-image since we install kernel manually
          CHROOT_LINUX_IMG=$(sudo find /usr/share/live/build /usr/lib/live/build -name 'chroot_linux-image' -type f 2>/dev/null | head -1)
          if [ -n "$CHROOT_LINUX_IMG" ]; then
            echo "=== Disabling lb_chroot_linux-image at $CHROOT_LINUX_IMG (kernel installed manually) ==="
            sudo cp "$CHROOT_LINUX_IMG" "${CHROOT_LINUX_IMG}.bak"
            echo '# Disabled by Mavis - lb_chroot_linux-image handled manually' | sudo tee "$CHROOT_LINUX_IMG"
          fi
          # Disable lb_chroot_hacks since it creates dangling symlinks and fails on chmod
          # (we handle boot files manually after kernel install)
          # Find chroot_hacks on either Debian (/usr/share) or Ubuntu (/usr/lib)
          CHROOT_HACKS=$(sudo find /usr/share/live/build /usr/lib/live/build -name 'chroot_hacks' -type f 2>/dev/null | head -1)
          if [ -n "$CHROOT_HACKS" ]; then
            echo "=== Disabling lb_chroot_hacks at $CHROOT_HACKS (handled manually) ==="
            sudo cp "$CHROOT_HACKS" "${CHROOT_HACKS}.bak"
            echo '# Disabled by Mavis - lb_chroot_hacks handled manually' | sudo tee "$CHROOT_HACKS"
          else
            echo "=== WARNING: chroot_hacks not found, searching... ==="
            sudo find /usr -name 'chroot_hacks' -type f 2>/dev/null
          fi
          # Disable lb_chroot_live-packages since lb bootstrap creates a default
          # live-packages.list.chroot with 'casper' (Ubuntu-only pkg, not on Debian)
          # First, find the file (try multiple patterns and locations)
          CHROOT_LIVE_PKGS=$(sudo find /usr/share/live/build /usr/lib/live/build /usr/libexec/live/build -name '*live-packages*' 2>/dev/null | head -1)
          if [ -z "$CHROOT_LIVE_PKGS" ]; then
            echo "=== WARNING: chroot_live-packages not found, listing all live-build files ==="
            sudo find /usr/share/live/build /usr/lib/live/build /usr/libexec/live/build -type f 2>/dev/null | sort
            # Try to find it anywhere
            CHROOT_LIVE_PKGS=$(sudo find /usr -name '*live-packages*' -type f 2>/dev/null | head -1)
          fi
          if [ -n "$CHROOT_LIVE_PKGS" ]; then
            echo "=== Disabling lb_chroot_live-packages at $CHROOT_LIVE_PKGS ==="
            sudo cp "$CHROOT_LIVE_PKGS" "${CHROOT_LIVE_PKGS}.bak"
            echo '# Disabled by Mavis - lb_chroot_live-packages handled manually' | sudo tee "$CHROOT_LIVE_PKGS"
          else
            echo "=== ERROR: chroot_live-packages not found anywhere! ==="
          fi
          # Disable lb_chroot_cache (tries to cp *.deb from workspace, fails)
          CHROOT_CACHE=$(sudo find /usr/share/live/build /usr/lib/live/build -name '*chroot_cache*' -type f 2>/dev/null | head -1)
          if [ -n "$CHROOT_CACHE" ]; then
            echo "=== Disabling lb_chroot_cache at $CHROOT_CACHE ==="
            sudo cp "$CHROOT_CACHE" "${CHROOT_CACHE}.bak"
            echo '# Disabled by Mavis - lb_chroot_cache not needed' | sudo tee "$CHROOT_CACHE"
          else
            echo "=== WARNING: chroot_cache not found, listing files ==="
            sudo find /usr/share/live/build /usr/lib/live/build -type f 2>/dev/null | sort
          fi
          # Disable lb_binary_linux-image (binary phase) since we handle kernel manually
          # On Ubuntu the file is named lb_binary_linux-image, on Debian binary_linux-image
          BINARY_LINUX_IMG=$(sudo find /usr/share/live/build /usr/lib/live/build /usr/libexec/live/build -name '*binary_linux-image*' -type f 2>/dev/null | head -1)
          if [ -z "$BINARY_LINUX_IMG" ]; then
            echo "=== WARNING: binary_linux-image not found, listing all files ==="
            sudo find /usr/share/live/build /usr/lib/live/build /usr/libexec/live/build -type f 2>/dev/null | sort
            # Try broader search
            BINARY_LINUX_IMG=$(sudo find /usr -name '*binary*linux*image*' -type f 2>/dev/null | head -1)
          fi
          if [ -n "$BINARY_LINUX_IMG" ]; then
            echo "=== Disabling lb_binary_linux-image at $BINARY_LINUX_IMG (kernel handled manually) ==="
            sudo cp "$BINARY_LINUX_IMG" "${BINARY_LINUX_IMG}.bak"
            echo '# Disabled by Mavis - lb_binary_linux-image handled manually' | sudo tee "$BINARY_LINUX_IMG"
          else
            echo "=== ERROR: binary_linux-image not found anywhere! Kernel copy will fail. ==="
          fi
          # Backup: create dummy .deb to satisfy glob in case cache restore runs
          ls -la ${{ github.workspace }}/*.deb 2>/dev/null || echo "=== No .deb files in workspace ==="
          touch ${{ github.workspace }}/dummy-mavis.deb
          echo "=== Created dummy .deb ==="
          # Fix wget to correct Contents-amd64.gz URL (dists/bookworm → dists/bookworm/main)
          # (lb_chroot_linux-image uses wrong URL path for newer Debian)
          if [ -f /usr/bin/wget ]; then
            sudo mv /usr/bin/wget /usr/bin/wget.real
            cat > /tmp/wget-wrapper << 'WGETEOF'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              */dists/*/Contents-amd64.gz)
                arg=$(echo "$arg" | sed 's#/dists/\([^/]*\)/Contents-amd64.gz#/dists/\1/main/Contents-amd64.gz#')
                ;;
            esac
            args+=("$arg")
          done
          exec /usr/bin/wget.real "${args[@]}"
          WGETEOF
            chmod +x /tmp/wget-wrapper
            sudo mv /tmp/wget-wrapper /usr/bin/wget
          fi
          # Remove dangling symlinks in chroot/boot to prevent lb_chroot_hacks chmod failures
          echo "=== Removing dangling symlinks in chroot/boot ==="
          find chroot/boot/ -type l ! -exec test -e {} \; -delete 2>/dev/null || true
          ls -la chroot/boot/ 2>/dev/null || echo "No boot dir"
          # Diagnostic: show ALL config files after lb bootstrap
          echo "=== ALL config files after lb bootstrap ==="
          sudo find config/ -type f | sort
          echo "=== Package list contents (after bootstrap) ==="
          for f in config/package-lists/*.list.chroot config/packages.list.chroot; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f" 2>/dev/null || echo "(empty)"
            fi
          done
          # Remove ALL package list files (lb bootstrap may recreate defaults
          # with Ubuntu-specific packages like linux-generic that don't exist
          # on Debian). Then re-copy our custom lists.
          echo "=== Removing ALL package list files (pre-chroot) ==="
          sudo rm -f config/packages.list.chroot
          sudo rm -f config/package-lists/*.list.chroot
          sudo rm -f config/package-lists/*.list.binary
          # Also remove any other package list variants
          sudo rm -f config/package-lists/*.list.chroot.live
          sudo rm -f config/package-lists/*.list.binary.live
          # Re-copy our custom package lists
          echo "=== Re-copying custom package lists ==="
          cp -r ../live-build/debian/config/package-lists/* config/package-lists/ 2>/dev/null || true
          cp ../live-build/debian/config/packages.list.chroot config/ 2>/dev/null || true
          echo "=== Package list files (pre-chroot) ==="
          sudo find config/ -name '*.list.chroot' -o -name '*.list.binary' | sort
          echo "=== Package list contents ==="
          for f in config/package-lists/*.list.chroot; do
            echo "--- $f ---"
            cat "$f" 2>/dev/null || echo "(empty)"
          done
          # Install dummy ubuntu-keyring BEFORE lb chroot so apt's dependency
          # resolver sees it as satisfied (some packages like calamares may
          # depend on it). On Debian, ubuntu-keyring doesn't exist as a real
          # package, so we provide a dummy. apt-mark hold prevents apt from
          # trying to remove/replace it during lb chroot's apt-get install.
          echo "=== Installing dummy ubuntu-keyring (pre-chroot) ==="
          mkdir -p /tmp/dummy-keyring/DEBIAN
          printf 'Package: ubuntu-keyring\nVersion: 9999.99.99\nArchitecture: all\nMaintainer: dummy\nDescription: dummy\nSection: misc\nPriority: optional\n' > /tmp/dummy-keyring/DEBIAN/control
          dpkg-deb --build /tmp/dummy-keyring /tmp/dummy-keyring.deb 2>/dev/null
          sudo cp /tmp/dummy-keyring.deb chroot/tmp/
          sudo chroot chroot dpkg -i /tmp/dummy-keyring.deb 2>/dev/null || true
          sudo chroot chroot apt-mark hold ubuntu-keyring 2>/dev/null || true
          echo "=== Dummy ubuntu-keyring installed and held (pre-chroot) ==="
          # Install dummy linux-generic BEFORE lb chroot so apt sees it as
          # satisfied. On Debian, linux-generic doesn't exist as a real package
          # but live-build may reference it. apt-mark hold prevents apt from
          # trying to remove/replace it during lb chroot's apt-get install.
          echo "=== Installing dummy linux-generic (pre-chroot) ==="
          mkdir -p /tmp/dummy-linux-generic/DEBIAN
          printf 'Package: linux-generic\nVersion: 9999.99.99\nArchitecture: all\nMaintainer: dummy\nDescription: dummy linux-generic\nSection: misc\nPriority: optional\n' > /tmp/dummy-linux-generic/DEBIAN/control
          dpkg-deb --build /tmp/dummy-linux-generic /tmp/dummy-linux-generic.deb 2>/dev/null
          sudo cp /tmp/dummy-linux-generic.deb chroot/tmp/
          sudo chroot chroot dpkg -i /tmp/dummy-linux-generic.deb 2>/dev/null || true
          sudo chroot chroot apt-mark hold linux-generic 2>/dev/null || true
          echo "=== Dummy linux-generic installed and held (pre-chroot) ==="
          # Run chroot stage (installs packages from config/package-lists/)
          sudo lb chroot
          # Install kernel packages using dpkg --root (from OUTSIDE chroot).
          # After lb chroot, chroot /tmp/ is unmounted/cleaned, so we cannot
          # use `chroot chroot dpkg -i /tmp/*.deb`. Instead, use --root= to
          # install directly from the host filesystem.
          echo "=== Installing kernel packages (post-chroot, via dpkg --root) ==="
          sudo dpkg --root=$PWD/chroot -i ${{ github.workspace }}/linux-*.deb 2>&1 | tail -10 || true
          sudo chroot chroot apt-get install -f -y --allow-unauthenticated 2>&1 | tail -5 || true
          # Verify kernel files exist
          echo "=== Verifying kernel files after install ==="
          sudo ls -la chroot/boot/vmlinuz-* 2>/dev/null || echo "ERROR: No vmlinuz in chroot/boot!"
          sudo ls -la chroot/boot/initrd.img-* 2>/dev/null || echo "ERROR: No initrd.img in chroot/boot!"
          # Remove dangling symlinks in chroot/boot before lb binary
          # (lb_chroot_hacks creates initrd.img symlinks that point to non-existent files)
          echo "=== Removing dangling symlinks in chroot/boot (pre-binary) ==="
          find chroot/boot/ -type l ! -exec test -e {} \; -delete 2>/dev/null || true
          ls -la chroot/boot/ 2>/dev/null || echo "No boot dir"
          # Remove live-packages.list.chroot again (lb bootstrap may have recreated it)
          echo "=== Removing live-packages.list.chroot (pre-binary) ==="
          sudo rm -f config/package-lists/live-packages.list.chroot
          echo "=== Package list files (pre-binary) ==="
          sudo find config/ -name '*.list.chroot' -o -name '*.list.binary' | sort
          # Install dummy packages AFTER lb chroot using dpkg --root (from outside chroot).
          # After lb chroot, chroot /tmp/ is cleaned, so we use --root= to install directly.
          echo "=== Installing dummy packages (pre-binary, via dpkg --root) ==="
          mkdir -p /tmp/dummy-keyring/DEBIAN
          printf 'Package: ubuntu-keyring\nVersion: 9999.99.99\nArchitecture: all\nMaintainer: dummy\nDescription: dummy\nSection: misc\nPriority: optional\n' > /tmp/dummy-keyring/DEBIAN/control
          dpkg-deb --build /tmp/dummy-keyring /tmp/dummy-keyring.deb 2>/dev/null
          sudo dpkg --root=$PWD/chroot -i /tmp/dummy-keyring.deb 2>/dev/null || true
          sudo chroot chroot apt-mark hold ubuntu-keyring 2>/dev/null || true
          mkdir -p /tmp/dummy-linux-generic/DEBIAN
          printf 'Package: linux-generic\nVersion: 9999.99.99\nArchitecture: all\nMaintainer: dummy\nDescription: dummy linux-generic\nSection: misc\nPriority: optional\n' > /tmp/dummy-linux-generic/DEBIAN/control
          dpkg-deb --build /tmp/dummy-linux-generic /tmp/dummy-linux-generic.deb 2>/dev/null
          sudo dpkg --root=$PWD/chroot -i /tmp/dummy-linux-generic.deb 2>/dev/null || true
          sudo chroot chroot apt-mark hold linux-generic 2>/dev/null || true
          echo "=== Dummy packages installed and held ==="
          # Diagnostic: check if kernel .deb files exist and kernel is installed
          echo "=== Kernel .deb files in workspace ==="
          ls -la ${{ github.workspace }}/*.deb 2>/dev/null || echo "No .deb files found"
          echo "=== Kernel .deb files in chroot/tmp ==="
          ls -la chroot/tmp/*.deb 2>/dev/null || echo "No .deb files in chroot/tmp"
          echo "=== Kernel files in chroot/boot ==="
          ls -la chroot/boot/vmlinuz-* 2>/dev/null || echo "No vmlinuz in chroot/boot"
          ls -la chroot/boot/initrd.img-* 2>/dev/null || echo "No initrd.img in chroot/boot"
          echo "=== dpkg -l | grep linux-image ==="
          sudo chroot chroot dpkg -l | grep linux-image 2>/dev/null || echo "No linux-image packages installed"
          # Create local apt repo with dummy ubuntu-keyring for lb binary phase
          # (lb_chroot_archives chroot install runs apt-get update which clears apt cache,
          # making the dummy package invisible to dependency resolver. Local repo fixes this.)
          echo "=== Creating local apt repo for dummy ubuntu-keyring ==="
          mkdir -p /tmp/local-repo/pool/main/u/ubuntu-keyring
          cp /tmp/dummy-keyring.deb /tmp/local-repo/pool/main/u/ubuntu-keyring/
          cd /tmp/local-repo
          dpkg-scanpackages pool/main > Packages 2>/dev/null
          gzip -k Packages 2>/dev/null || true
          # Copy local repo into chroot at a STABLE path (NOT /tmp/ which gets cleaned)
          sudo mkdir -p ${{ github.workspace }}/live-build/chroot/opt/local-repo
          sudo cp -r /tmp/local-repo/* ${{ github.workspace }}/live-build/chroot/opt/local-repo/
          # Disable lb_chroot_archives_chroot_install since it overwrites
          # /etc/apt/sources.list and ignores our local-repo.list, causing
          # ubuntu-keyring dependency to fail. We configure apt manually.
          CHROOT_ARCHIVES=$(sudo find /usr/share/live/build /usr/lib/live/build /usr/libexec/live/build -name '*chroot_archives*' -type f 2>/dev/null | head -1)
          if [ -n "$CHROOT_ARCHIVES" ]; then
            echo "=== Disabling lb_chroot_archives at $CHROOT_ARCHIVES (apt configured manually) ==="
            sudo cp "$CHROOT_ARCHIVES" "${CHROOT_ARCHIVES}.bak"
            echo '# Disabled by Mavis - lb_chroot_archives handled manually' | sudo tee "$CHROOT_ARCHIVES"
          fi
          # Manually configure apt sources for binary phase (including local repo)
          echo "=== Manually configuring apt sources for binary phase ==="
          sudo mkdir -p ${{ github.workspace }}/live-build/chroot/etc/apt/sources.list.d
          # Write sources.list with remote repos + local repo
          sudo tee ${{ github.workspace }}/live-build/chroot/etc/apt/sources.list << EOF
          deb [trusted=yes] http://deb.debian.org/debian ${{ inputs.release_line }} main contrib non-free non-free-firmware
          deb [trusted=yes] http://deb.debian.org/debian ${{ inputs.release_line }}-updates main contrib non-free non-free-firmware
          deb [trusted=yes] http://security.debian.org/debian-security ${{ inputs.release_line }}-security main contrib non-free-firmware
          deb [trusted=yes] file:///opt/local-repo ./
          EOF
          # Also add local-repo.list for redundancy
          echo "deb [trusted=yes] file:///opt/local-repo ./" | sudo tee ${{ github.workspace }}/live-build/chroot/etc/apt/sources.list.d/local-repo.list
          cd ${{ github.workspace }}/live-build
          sudo chroot chroot apt-get update 2>&1 | tail -5
          echo "=== Apt sources configured ==="
          # Fix isohybrid if not available (syslinux-utils may not provide it on GitHub runners)
          if ! command -v isohybrid &>/dev/null; then
            echo "=== Creating fake isohybrid wrapper ==="
            echo '#!/bin/bash' > /tmp/fake-isohybrid
            echo '# Fake isohybrid - just exit 0 (ISO still created, just not USB-hybrid)' >> /tmp/fake-isohybrid
            echo 'exit 0' >> /tmp/fake-isohybrid
            chmod +x /tmp/fake-isohybrid
            sudo mv /tmp/fake-isohybrid /usr/local/bin/isohybrid
            echo "=== Fake isohybrid installed ==="
          fi
          # Create ISO
          sudo lb binary
          # Manually copy kernel to binary/boot (since lb_binary_linux-image is disabled)
          echo "=== Copying kernel to binary/boot (post-binary) ==="
          sudo cp chroot/boot/vmlinuz-* binary/boot/ 2>/dev/null || echo "WARNING: No vmlinuz found"
          sudo cp chroot/boot/initrd.img-* binary/boot/ 2>/dev/null || echo "WARNING: No initrd.img found"
          ls -lh binary/boot/ 2>/dev/null || echo "No binary/boot dir"
          echo "ISO built successfully:"
          ls -lh *.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v5
        with:
          name: live-debian-${{ inputs.release_line }}-${{ env.KERNEL_VERSION }}-amd64
          path: live-build/*.iso
          if-no-files-found: error
          compression-level: 0
