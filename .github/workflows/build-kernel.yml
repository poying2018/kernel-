name: Build Linux Kernel (Multi-Distro)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "1. Target Architecture (choose first)"
        required: true
        type: choice
        options:
          - amd64
          - arm64
          - armhf
          - riscv64
      distribution:
        description: "2. Linux Distribution"
        required: true
        type: choice
        options:
          - debian
          - ubuntu
          - archlinux
      release_line:
        description: "3. Distribution Release Line (depends on Distribution)"
        required: true
        type: choice
        options:
          - debian-bookworm
          - debian-trixie
          - ubuntu-jammy
          - ubuntu-noble
          - ubuntu-oracular
          - ubuntu-plucky
          - arch-rolling
      branch:
        description: "4. Distribution Branch (depends on Release Line)"
        required: true
        type: choice
        options:
          - stable
          - testing
          - main
          - rolling
      kernel_version:
        description: "5. Kernel Version (depends on Release Line)"
        required: true
        type: choice
        options:
          - distro-default
          - "5.4"
          - "5.10"
          - "5.15"
          - "6.0"
          - "6.1"
          - "6.2"
          - "6.3"
          - "6.4"
          - "6.5"
          - "6.6"
          - "6.7"
          - "6.8"
          - "6.9"
          - "6.10"
          - "6.11"
          - "6.12"
          - "6.13"
          - "6.14"
          - "6.15"
          - "6.16"
          - "6.17"
          - "6.18"
          - "6.19"
          - "7.0"
          - "7.1"
      flavour:
        description: "6. Kernel Flavour"
        required: true
        type: choice
        options:
          - amd64
          - amd64-cloud
          - arm64
          - arm64-cloud
          - rt-amd64
          - liquorix-amd64

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v5

      - name: Validate input combination
        run: |
          set -euo pipefail
          ARCH="${{ inputs.arch }}"
          DIST="${{ inputs.distribution }}"
          RELEASE="${{ inputs.release_line }}"
          BRANCH="${{ inputs.branch }}"
          KVER="${{ inputs.kernel_version }}"
          FLAVOUR="${{ inputs.flavour }}"

          # Validate distribution matches release_line
          case "$RELEASE" in
            debian-*)   [[ "$DIST" == "debian" ]]   || { echo "ERROR: release_line $RELEASE requires distribution=debian"; exit 1; } ;;
            ubuntu-*)   [[ "$DIST" == "ubuntu" ]]   || { echo "ERROR: release_line $RELEASE requires distribution=ubuntu"; exit 1; } ;;
            arch-*)     [[ "$DIST" == "archlinux" ]] || { echo "ERROR: release_line $RELEASE requires distribution=archlinux"; exit 1; } ;;
          esac

          # Validate branch per distribution
          case "$DIST" in
            debian)
              case "$RELEASE" in
                debian-bookworm) [[ "$BRANCH" == "stable" ]]   || { echo "ERROR: debian-bookworm requires branch=stable"; exit 1; } ;;
                debian-trixie)   [[ "$BRANCH" == "testing" ]]   || { echo "ERROR: debian-trixie requires branch=testing"; exit 1; } ;;
              esac
              ;;
            ubuntu)
              case "$BRANCH" in
                stable|main) ;; *) { echo "ERROR: ubuntu requires branch=stable or main (got '$BRANCH')"; exit 1; } ;;
              esac
              ;;
            archlinux)
              [[ "$BRANCH" == "rolling" ]] || { echo "ERROR: archlinux requires branch=rolling"; exit 1; }
              ;;
          esac

          # Validate kernel_version format (x.y format, must be a valid stable release)
          if [[ "$KVER" != "distro-default" ]]; then
            [[ "$KVER" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "ERROR: invalid kernel version format '$KVER' (expected X.Y)"; exit 1; }
            # Verify the tag exists on kernel.org
            if [[ "$DIST" == "archlinux" ]] || [[ "$KVER" != "distro-default" ]]; then
              echo "  Kernel version: $KVER (from kernel.org stable)"
            fi
          fi

          # Validate flavour compatibility with arch
          case "$ARCH" in
            amd64)
              [[ "$FLAVOUR" == "amd64" || "$FLAVOUR" == "amd64-cloud" || "$FLAVOUR" == "rt-amd64" || "$FLAVOUR" == "liquorix-amd64" ]] || { echo "ERROR: arch=amd64 supports amd64/amd64-cloud/rt-amd64/liquorix-amd64 (got '$FLAVOUR')"; exit 1; }
              ;;
            arm64)
              [[ "$FLAVOUR" == "arm64" || "$FLAVOUR" == "arm64-cloud" ]] || { echo "ERROR: arch=arm64 supports arm64/arm64-cloud (got '$FLAVOUR')"; exit 1; }
              ;;
            armhf)
              [[ "$FLAVOUR" == "arm64" ]] || { echo "ERROR: arch=armhf uses arm64 flavour"; exit 1; }
              ;;
            riscv64)
              [[ "$FLAVOUR" == "amd64" ]] || { echo "ERROR: arch=riscv64 uses amd64 flavour"; exit 1; }
              ;;
          esac

          echo "✓ Input validation passed"
          echo "  Architecture: $ARCH"
          echo "  Distribution: $DIST"
          echo "  Release: $RELEASE"
          echo "  Branch: $BRANCH"
          echo "  Kernel: $KVER"
          echo "  Flavour: $FLAVOUR"

      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev libdw-dev dwarves \
            ccache fakeroot devscripts debhelper dpkg-dev git wget xz-utils kmod cpio rsync lsb-release

      - name: Set architecture mapping
        run: |
          case "${{ inputs.arch }}" in
            amd64)   echo "KERNEL_ARCH=x86_64" >> $GITHUB_ENV ;;
            arm64)   echo "KERNEL_ARCH=arm64" >> $GITHUB_ENV ;;
            armhf)   echo "KERNEL_ARCH=arm" >> $GITHUB_ENV ;;
            riscv64) echo "KERNEL_ARCH=riscv" >> $GITHUB_ENV ;;
            *)       echo "KERNEL_ARCH=${{ inputs.arch }}" >> $GITHUB_ENV ;;
          esac
          echo "KERNEL_ARCH=$KERNEL_ARCH"

      - name: Install cross-compilation toolchain
        if: inputs.arch != 'amd64'
        run: |
          case "${{ inputs.arch }}" in
            arm64)
              sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
              echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
              ;;
            armhf)
              sudo apt-get install -y -qq gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
              echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> $GITHUB_ENV
              ;;
            riscv64)
              sudo apt-get install -y -qq gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
              echo "CROSS_COMPILE=riscv64-linux-gnu-" >> $GITHUB_ENV
              ;;
          esac

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.arch }}-${{ inputs.distribution }}-${{ inputs.release_line }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.arch }}-${{ inputs.distribution }}-${{ inputs.release_line }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}-
            ccache-${{ inputs.arch }}-${{ inputs.distribution }}-${{ inputs.release_line }}-${{ inputs.kernel_version }}-
            ccache-${{ inputs.arch }}-${{ inputs.distribution }}-
            ccache-${{ inputs.arch }}-

      - name: Initialize ccache
        run: |
          mkdir -p ${{ env.CCACHE_DIR }}
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=max_size=${{ env.CCACHE_MAXSIZE }}
          ccache --set-config=compression=${{ env.CCACHE_COMPRESS }}
          ccache --set-config=base_dir=${{ github.workspace }}
          ccache -z
          ccache -s

      - name: Select official distribution source
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ inputs.distribution }}"
          RELEASE_LINE="${{ inputs.release_line }}"
          BRANCH="${{ inputs.branch }}"
          REQUESTED_VERSION="${{ inputs.kernel_version }}"
          SOURCE_REPO=""
          SOURCE_REF=""
          RESOLVED_VERSION="$REQUESTED_VERSION"

          # Default: kernel.org upstream stable (works for any version)
          SOURCE_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
          SOURCE_REF="v${REQUESTED_VERSION}"
          RESOLVED_VERSION="$REQUESTED_VERSION"

          case "$RELEASE_LINE" in
            # Debian: use kernel.org upstream, any version supported
            debian-bookworm)
              if [[ "$REQUESTED_VERSION" == "distro-default" ]]; then
                SOURCE_REF="v6.1"
                RESOLVED_VERSION="6.1"
              else
                SOURCE_REF="v${REQUESTED_VERSION}"
                RESOLVED_VERSION="$REQUESTED_VERSION"
              fi
              ;;
            debian-trixie)
              if [[ "$REQUESTED_VERSION" == "distro-default" ]]; then
                SOURCE_REF="v6.12"
                RESOLVED_VERSION="6.12"
              else
                SOURCE_REF="v${REQUESTED_VERSION}"
                RESOLVED_VERSION="$REQUESTED_VERSION"
              fi
              ;;

            # Ubuntu: prefer Launchpad distro-specific tags, fallback to kernel.org
            ubuntu-jammy)
              SOURCE_REPO="https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/jammy"
              case "$REQUESTED_VERSION" in
                distro-default|5.15) SOURCE_REF="Ubuntu-5.15.0-168.178"; RESOLVED_VERSION="5.15" ;;
                6.2) SOURCE_REF="Ubuntu-hwe-6.2-6.2.0-40.41_22.04.1"; RESOLVED_VERSION="6.2" ;;
                6.5) SOURCE_REF="Ubuntu-hwe-6.5-6.5.0-41.41_22.04.1"; RESOLVED_VERSION="6.5" ;;
                6.8) SOURCE_REF="Ubuntu-lowlatency-hwe-6.8-6.8.0-134.134.1_22.04.1"; RESOLVED_VERSION="6.8" ;;
                *)
                  # Other versions: use kernel.org upstream
                  SOURCE_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
                  SOURCE_REF="v${REQUESTED_VERSION}"
                  RESOLVED_VERSION="$REQUESTED_VERSION"
                  ;;
              esac
              ;;
            ubuntu-noble)
              SOURCE_REPO="https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/noble"
              case "$REQUESTED_VERSION" in
                distro-default|6.8) SOURCE_REF="Ubuntu-6.8.0-57.59"; RESOLVED_VERSION="6.8" ;;
                *)
                  SOURCE_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
                  SOURCE_REF="v${REQUESTED_VERSION}"
                  RESOLVED_VERSION="$REQUESTED_VERSION"
                  ;;
              esac
              ;;
            ubuntu-oracular)
              SOURCE_REPO="https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/oracular"
              case "$REQUESTED_VERSION" in
                distro-default|6.8) SOURCE_REF="Ubuntu-6.8.0-24.24"; RESOLVED_VERSION="6.8" ;;
                *)
                  SOURCE_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
                  SOURCE_REF="v${REQUESTED_VERSION}"
                  RESOLVED_VERSION="$REQUESTED_VERSION"
                  ;;
              esac
              ;;
            ubuntu-plucky)
              SOURCE_REPO="https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/plucky"
              case "$REQUESTED_VERSION" in
                distro-default|6.8) SOURCE_REF="Ubuntu-6.8.0-26.26"; RESOLVED_VERSION="6.8" ;;
                *)
                  SOURCE_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
                  SOURCE_REF="v${REQUESTED_VERSION}"
                  RESOLVED_VERSION="$REQUESTED_VERSION"
                  ;;
              esac
              ;;

            # Arch Linux: kernel.org stable (version from PKGBUILD or user choice)
            arch-rolling)
              git clone --depth 1 --branch main https://gitlab.archlinux.org/archlinux/packaging/packages/linux.git arch-packaging 2>/dev/null
              if [ -f arch-packaging/PKGBUILD ]; then
                ARCH_PKGVER=$(sed -n "s/^pkgver=//p" arch-packaging/PKGBUILD | head -n 1)
                ARCH_BASEVER="${ARCH_PKGVER%%.arch*}"
                echo "Arch package version: $ARCH_PKGVER"
              fi
              if [[ "$REQUESTED_VERSION" == "distro-default" ]]; then
                RESOLVED_VERSION="${ARCH_BASEVER:-7.1}"
              fi
              SOURCE_REF="v${RESOLVED_VERSION}"
              ;;
          esac

          echo "Source repository: $SOURCE_REPO"
          echo "Source reference: $SOURCE_REF"
          # Try multiple sources for reliability
          CLONE_SUCCESS=false
          for attempt in 1 2 3; do
            echo "Clone attempt ..."
            if git clone --depth 1 --branch "" "" linux-src 2>&1; then
              if [ -f linux-src/Makefile ]; then
                CLONE_SUCCESS=true
                break
              fi
            fi
            if [ "" -ge 2 ]; then
              echo "Trying GitHub mirror..."
              if git clone --depth 1 --branch "" "https://github.com/torvalds/linux.git" linux-src 2>&1; then
                if [ -f linux-src/Makefile ]; then
                  CLONE_SUCCESS=true
                  break
                fi
              fi
            fi
            sleep 5
          done

          if [ "" = false ]; then
            echo "ERROR: Failed to clone kernel source after multiple attempts."
            exit 1
          fi

          cd linux-src
          echo "KERNEL_SRC_DIR=$(pwd)" >> "$GITHUB_ENV"
          echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "SOURCE_KERNEL_VERSION=$RESOLVED_VERSION" >> "$GITHUB_ENV"
          echo "Source HEAD: $(git log --oneline -1)"
          echo "Kernel version: $(make kernelversion 2>/dev/null || echo 'N/A')"
        timeout-minutes: 20

      - name: Apply RT patches
        if: inputs.flavour == 'rt-amd64'
        continue-on-error: true
        run: |
          cd $KERNEL_SRC_DIR
          KVER="${SOURCE_KERNEL_VERSION}"
          echo "Downloading RT patch for kernel ${KVER}..."
          RT_BASE="https://mirrors.edge.kernel.org/pub/linux/kernel/projects/rt"
          for RT_VER in $(seq 20 -1 1); do
            URL="${RT_BASE}/${KVER}/patch-${KVER}-rt${RT_VER}.patch.xz"
            echo "Trying ${URL}..."
            if wget -q --spider "${URL}" 2>/dev/null; then
              wget -q "${URL}" -O /tmp/rt.patch.xz
              xz -d /tmp/rt.patch.xz
              break
            fi
          done
          if [ ! -f /tmp/rt.patch ]; then
            echo "WARNING: Could not find RT patch, building without it"
            exit 0
          fi
          echo "Applying RT patch..."
          git apply --check /tmp/rt.patch 2>/dev/null && git apply /tmp/rt.patch || {
            echo "git apply failed, trying patch -p1..."
            patch -p1 --forward < /tmp/rt.patch || echo "WARNING: RT patch application had issues"
          }
          echo "RT patch applied"

      - name: Apply Liquorix patches
        if: inputs.flavour == 'liquorix-amd64'
        continue-on-error: true
        run: |
          cd $KERNEL_SRC_DIR
          git clone --depth 1 https://github.com/damentz/liquorix-package.git /tmp/liquorix
          KVER="${SOURCE_KERNEL_VERSION}"
          PATCH_FILE=$(find /tmp/liquorix -name "*${KVER}*" -name "*.patch" 2>/dev/null | head -1)
          if [ -z "$PATCH_FILE" ]; then
            echo "WARNING: No Liquorix patch found for kernel ${KVER}, building without it"
            find /tmp/liquorix -name "*.patch" 2>/dev/null | head -20
            exit 0
          fi
          echo "Applying patch: $PATCH_FILE"
          git am "$PATCH_FILE" 2>/dev/null || git am --3way "$PATCH_FILE" 2>/dev/null || echo "WARNING: Liquorix patch application had issues"

      - name: Patch compiler version check
        run: |
          cd $KERNEL_SRC_DIR
          if [ -f scripts/gcc-version.sh ]; then
            # Replace gcc-version.sh with a version that always returns a valid version
            # This bypasses the "compiler not supported" error for newer GCC on older kernels
            echo '#!/bin/sh' > scripts/gcc-version.sh
            echo '# Patched for compatibility with newer GCC versions' >> scripts/gcc-version.sh
            echo 'exec "$@" -dumpversion 2>/dev/null | sed "s/\\..*//; s/^/100/; s/$/00/" || echo "120000"' >> scripts/gcc-version.sh
            chmod +x scripts/gcc-version.sh
            echo "Patched scripts/gcc-version.sh for compiler compatibility"
          fi


      - name: Configure kernel
        run: |
          cd $KERNEL_SRC_DIR
          if [ -n "${CROSS_COMPILE:-}" ]; then
            CC="ccache ${CROSS_COMPILE}gcc"
          else
            CC="ccache gcc"
          fi
          make ARCH=$KERNEL_ARCH ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} CC="$CC" defconfig

          # Disable debug info for faster build
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_NONE
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
          ./scripts/config --disable CONFIG_KGDB
          ./scripts/config --disable CONFIG_DEBUG_KERNEL
          ./scripts/config --disable CONFIG_DEBUG_MISC

          # Cloud flavour: disable unnecessary drivers
          if [[ "${{ inputs.flavour }}" == *"-cloud" ]]; then
            echo "Applying cloud optimizations..."
            ./scripts/config --disable CONFIG_DRM
            ./scripts/config --disable CONFIG_SOUND
            ./scripts/config --disable CONFIG_INPUT_JOYSTICK
            ./scripts/config --disable CONFIG_INPUT_TABLET
            ./scripts/config --disable CONFIG_INPUT_TOUCHSCREEN
            ./scripts/config --disable CONFIG_INPUT_MISC
            ./scripts/config --disable CONFIG_VGA_CONSOLE
            ./scripts/config --disable CONFIG_FB
            ./scripts/config --disable CONFIG_VT
            ./scripts/config --disable CONFIG_VT_CONSOLE
            ./scripts/config --disable CONFIG_INFINIBAND
            ./scripts/config --disable CONFIG_WIRELESS
            ./scripts/config --disable CONFIG_WLAN
            ./scripts/config --disable CONFIG_BT
            ./scripts/config --disable CONFIG_CFG80211
            ./scripts/config --disable CONFIG_MAC80211
            ./scripts/config --disable CONFIG_PPP
            ./scripts/config --disable CONFIG_PPPOE
            ./scripts/config --disable CONFIG_ISDN
            ./scripts/config --disable CONFIG_PHONE
            ./scripts/config --disable CONFIG_RFKILL
            ./scripts/config --disable CONFIG_REGULATOR
            ./scripts/config --disable CONFIG_MEDIA_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_CAMERA_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_ANALOG_TV_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_DIGITAL_TV_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_RADIO_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_SDR_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_CONTROLLER
            ./scripts/config --disable CONFIG_VIDEO_DEV
            ./scripts/config --disable CONFIG_DVB_CORE
            ./scripts/config --disable CONFIG_RC_CORE
            ./scripts/config --disable CONFIG_HID
            ./scripts/config --disable CONFIG_USB_HID
            ./scripts/config --disable CONFIG_HID_GENERIC
            ./scripts/config --disable CONFIG_USB_KBD
            ./scripts/config --disable CONFIG_USB_MOUSE
            ./scripts/config --disable CONFIG_I2C_HID
            ./scripts/config --disable CONFIG_INPUT_KEYBOARD
            ./scripts/config --disable CONFIG_INPUT_MOUSE
            ./scripts/config --disable CONFIG_SERIO
            ./scripts/config --disable CONFIG_VT_HW_CONSOLE_BINDING
          fi

          # RT flavour: enable real-time preemption
          if [[ "${{ inputs.flavour }}" == "rt-amd64" ]]; then
            echo "Enabling RT preemption..."
            ./scripts/config --enable CONFIG_PREEMPT_RT
            ./scripts/config --disable CONFIG_PREEMPT_NONE
            ./scripts/config --disable CONFIG_PREEMPT_VOLUNTARY
            ./scripts/config --disable CONFIG_PREEMPT
          fi

          ./scripts/config --disable CONFIG_WERROR
          make ARCH=$KERNEL_ARCH ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} CC="$CC" olddefconfig

      - name: Build kernel
        run: |
          cd $KERNEL_SRC_DIR
          NPROC=$(nproc)
          echo "Building with ${NPROC} parallel jobs..."
          echo "ccache stats before build:"
          ccache -s

          # Set compiler based on target architecture
          if [ -n "${CROSS_COMPILE:-}" ]; then
            CC="ccache ${CROSS_COMPILE}gcc"
          else
            CC="ccache gcc"
          fi

          if [ "${{ inputs.arch }}" != "amd64" ]; then
            echo "Cross-compiling for $KERNEL_ARCH..."
            make -j$NPROC ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE CC="$CC" KCFLAGS=-Wno-error WERROR=0 LOCALVERSION=-${{ inputs.flavour }} KDEB_PKGVERSION=${SOURCE_KERNEL_VERSION}-1
            make -j$NPROC ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE CC="$CC" KCFLAGS=-Wno-error=format WERROR=0 LOCALVERSION=-${{ inputs.flavour }} KDEB_PKGVERSION=${SOURCE_KERNEL_VERSION}-1 modules
            if [ "$KERNEL_ARCH" = "arm64" ] || [ "$KERNEL_ARCH" = "arm" ]; then
              make -j$NPROC ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE CC="$CC" KCFLAGS=-Wno-error=format WERROR=0 LOCALVERSION=-${{ inputs.flavour }} KDEB_PKGVERSION=${SOURCE_KERNEL_VERSION}-1 dtbs
            fi
            echo "Cross-compilation build complete."
          else
            echo "Native build for $KERNEL_ARCH using bindeb-pkg..."
            make -j$NPROC ARCH=$KERNEL_ARCH CC="$CC" KCFLAGS=-Wno-error=format WERROR=0 LOCALVERSION=-${{ inputs.flavour }} KDEB_PKGVERSION=${SOURCE_KERNEL_VERSION}-1 bindeb-pkg
          fi

          echo ""
          echo "ccache stats after build:"
          ccache -s
        timeout-minutes: 300

      - name: Collect build artifacts
        run: |
          cd $KERNEL_SRC_DIR
          ARTIFACT_DIR="${{ github.workspace }}/artifacts"
          mkdir -p ${ARTIFACT_DIR}

          find .. -maxdepth 1 -name "*.deb" -exec cp {} ${ARTIFACT_DIR}/ \;

          if [ -f arch/$KERNEL_ARCH/boot/bzImage ]; then
            cp arch/$KERNEL_ARCH/boot/bzImage ${ARTIFACT_DIR}/
          fi
          if [ -f arch/$KERNEL_ARCH/boot/Image ]; then
            cp arch/$KERNEL_ARCH/boot/Image ${ARTIFACT_DIR}/
          fi
          if [ -f vmlinux ]; then
            xz -z -k -T0 vmlinux
            cp vmlinux.xz ${ARTIFACT_DIR}/
          fi

          cp .config ${ARTIFACT_DIR}/config-${SOURCE_KERNEL_VERSION}-${{ inputs.flavour }}

          make ARCH=$KERNEL_ARCH ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} \
            INSTALL_MOD_PATH=${ARTIFACT_DIR}/modules modules_install
          cd ${ARTIFACT_DIR}/modules
          tar cJf ../modules-${SOURCE_KERNEL_VERSION}-${{ inputs.flavour }}-${{ inputs.arch }}.tar.xz .
          cd ${ARTIFACT_DIR}
          rm -rf modules

          echo "=== Build Artifacts ==="
          ls -lh ${ARTIFACT_DIR}/

      - name: Save ccache
        if: always()
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.arch }}-${{ inputs.distribution }}-${{ inputs.release_line }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}-${{ github.run_id }}

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ inputs.arch }}-${{ inputs.distribution }}-${{ inputs.release_line }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0









