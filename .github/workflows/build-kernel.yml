name: Build Debian Linux Kernel

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构 (Architecture)"
        required: true
        type: choice
        options:
          - amd64
          - arm64
          - armhf
          - riscv64
      distro:
        description: "Debian 发行版本 (Distribution)"
        required: true
        type: choice
        options:
          - buster
          - bullseye
          - bookworm
          - trixie
      branch:
        description: "Debian 发布分支 (Branch)"
        required: true
        type: choice
        options:
          - stable
          - testing
          - unstable
          - experimental
      kernel_version:
        description: "内核版本 (Kernel Version)"
        required: true
        type: choice
        options:
          - "5.10"
          - "6.1"
          - "6.6"
          - "6.12"
      flavour:
        description: "内核插件/Flavour (Kernel Flavour)"
        required: true
        type: choice
        options:
          - amd64
          - amd64-cloud
          - arm64
          - arm64-cloud
          - rt-amd64
          - liquorix-amd64

env:
  ARCH: ${{ inputs.arch }}
  DISTRO: ${{ inputs.distro }}
  BRANCH: ${{ inputs.branch }}
  KERNEL_VERSION: ${{ inputs.kernel_version }}
  FLAVOUR: ${{ inputs.flavour }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            ccache fakeroot devscripts debhelper git wget xz-utils kmod cpio rsync

      - name: Install cross-compilation toolchain
        if: inputs.arch != 'amd64'
        run: |
          case "${{ inputs.arch }}" in
            arm64)
              sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
              echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
              ;;
            armhf)
              sudo apt-get install -y -qq gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
              echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> $GITHUB_ENV
              ;;
            riscv64)
              sudo apt-get install -y -qq gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
              echo "CROSS_COMPILE=riscv64-linux-gnu-" >> $GITHUB_ENV
              ;;
          esac

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.arch }}-${{ inputs.distro }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.arch }}-${{ inputs.distro }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}-
            ccache-${{ inputs.arch }}-${{ inputs.distro }}-${{ inputs.kernel_version }}-
            ccache-${{ inputs.arch }}-${{ inputs.distro }}-
            ccache-${{ inputs.arch }}-

      - name: Initialize ccache
        run: |
          mkdir -p ${{ env.CCACHE_DIR }}
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=max_size=${{ env.CCACHE_MAXSIZE }}
          ccache --set-config=compression=${{ env.CCACHE_COMPRESS }}
          ccache --set-config=base_dir=${{ github.workspace }}
          ccache -z
          ccache -s

      - name: Clone Linux kernel source
        run: |
          echo "Cloning Linux kernel source (version: v${{ inputs.kernel_version }})..."
          git clone --depth 1 --branch "v${{ inputs.kernel_version }}" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux-src
          cd linux-src
          echo "Source HEAD: $(git log --oneline -1)"
          echo "Kernel version: $(make kernelversion)"
        timeout-minutes: 15

      - name: Apply RT patches
        if: inputs.flavour == 'rt-amd64'
        continue-on-error: true
        run: |
          cd linux-src
          KVER="${{ inputs.kernel_version }}"
          echo "Downloading RT patch for kernel ${KVER}..."
          RT_BASE="https://mirrors.edge.kernel.org/pub/linux/kernel/projects/rt"
          # Try to find the latest RT patch
          for RT_VER in $(seq 20 -1 1); do
            URL="${RT_BASE}/${KVER}/patch-${KVER}-rt${RT_VER}.patch.xz"
            echo "Trying ${URL}..."
            if wget -q --spider "${URL}" 2>/dev/null; then
              wget -q "${URL}" -O /tmp/rt.patch.xz
              xz -d /tmp/rt.patch.xz
              break
            fi
          done
          if [ ! -f /tmp/rt.patch ]; then
            echo "WARNING: Could not find RT patch, building without it"
            exit 0
          fi
          echo "Applying RT patch..."
          git apply --check /tmp/rt.patch && git apply /tmp/rt.patch || {
            echo "git apply failed, trying patch -p1..."
            patch -p1 --forward < /tmp/rt.patch || echo "WARNING: RT patch application had issues"
          }
          echo "RT patch applied"

      - name: Apply Liquorix patches
        if: inputs.flavour == 'liquorix-amd64'
        continue-on-error: true
        run: |
          cd linux-src
          git clone --depth 1 https://github.com/damentz/liquorix-package.git /tmp/liquorix
          KVER="${{ inputs.kernel_version }}"
          PATCH_FILE=$(find /tmp/liquorix -name "*${KVER}*" -name "*.patch" | head -1)
          if [ -z "$PATCH_FILE" ]; then
            echo "WARNING: No Liquorix patch found for kernel ${KVER}, building without it"
            find /tmp/liquorix -name "*.patch" | head -20
            exit 0
          fi
          echo "Applying patch: $PATCH_FILE"
          git am "$PATCH_FILE" || git am --3way "$PATCH_FILE" || echo "WARNING: Liquorix patch application had issues"

      - name: Configure kernel
        run: |
          cd linux-src
          # Map architecture names to Linux kernel names
          case "${{ inputs.arch }}" in
            amd64)   KERNEL_ARCH="x86_64" ;;
            arm64)   KERNEL_ARCH="arm64" ;;
            armhf)   KERNEL_ARCH="arm" ;;
            riscv64) KERNEL_ARCH="riscv" ;;
            *)       KERNEL_ARCH="${{ inputs.arch }}" ;;
          esac
          echo "Configuring kernel (arch=${KERNEL_ARCH})..."
          make ARCH=${KERNEL_ARCH} ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} defconfig

          # Disable debug info for faster builds
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_NONE
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
          ./scripts/config --disable CONFIG_KGDB
          ./scripts/config --disable CONFIG_DEBUG_KERNEL
          ./scripts/config --disable CONFIG_DEBUG_MISC

          # Cloud flavour optimizations
          if [[ "${{ inputs.flavour }}" == *"-cloud" ]]; then
            echo "Applying cloud optimizations..."
            ./scripts/config --disable CONFIG_DRM
            ./scripts/config --disable CONFIG_SOUND
            ./scripts/config --disable CONFIG_INPUT_JOYSTICK
            ./scripts/config --disable CONFIG_INPUT_TABLET
            ./scripts/config --disable CONFIG_INPUT_TOUCHSCREEN
            ./scripts/config --disable CONFIG_INPUT_MISC
            ./scripts/config --disable CONFIG_VGA_CONSOLE
            ./scripts/config --disable CONFIG_FB
            ./scripts/config --disable CONFIG_VT
            ./scripts/config --disable CONFIG_VT_CONSOLE
            ./scripts/config --disable CONFIG_INFINIBAND
            ./scripts/config --disable CONFIG_WIRELESS
            ./scripts/config --disable CONFIG_WLAN
            ./scripts/config --disable CONFIG_BT
            ./scripts/config --disable CONFIG_CFG80211
            ./scripts/config --disable CONFIG_MAC80211
            ./scripts/config --disable CONFIG_PPP
            ./scripts/config --disable CONFIG_PPPOE
            ./scripts/config --disable CONFIG_ISDN
            ./scripts/config --disable CONFIG_PHONE
            ./scripts/config --disable CONFIG_RFKILL
            ./scripts/config --disable CONFIG_REGULATOR
            ./scripts/config --disable CONFIG_MEDIA_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_CAMERA_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_ANALOG_TV_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_DIGITAL_TV_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_RADIO_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_SDR_SUPPORT
            ./scripts/config --disable CONFIG_MEDIA_CONTROLLER
            ./scripts/config --disable CONFIG_VIDEO_DEV
            ./scripts/config --disable CONFIG_DVB_CORE
            ./scripts/config --disable CONFIG_RC_CORE
            ./scripts/config --disable CONFIG_HID
            ./scripts/config --disable CONFIG_USB_HID
            ./scripts/config --disable CONFIG_HID_GENERIC
            ./scripts/config --disable CONFIG_USB_KBD
            ./scripts/config --disable CONFIG_USB_MOUSE
            ./scripts/config --disable CONFIG_I2C_HID
            ./scripts/config --disable CONFIG_INPUT_KEYBOARD
            ./scripts/config --disable CONFIG_INPUT_MOUSE
            ./scripts/config --disable CONFIG_SERIO
            ./scripts/config --disable CONFIG_VT_HW_CONSOLE_BINDING
          fi

          # RT flavour: enable RT preemption
          if [[ "${{ inputs.flavour }}" == "rt-amd64" ]]; then
            echo "Enabling RT preemption..."
            ./scripts/config --enable CONFIG_PREEMPT_RT
            ./scripts/config --disable CONFIG_PREEMPT_NONE
            ./scripts/config --disable CONFIG_PREEMPT_VOLUNTARY
            ./scripts/config --disable CONFIG_PREEMPT
          fi

          make ARCH=${KERNEL_ARCH} ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} olddefconfig

      - name: Build kernel (make deb-pkg)
        run: |
          cd linux-src
          NPROC=$(nproc)
          echo "Building with ${NPROC} parallel jobs..."
          echo "ccache stats before build:"
          ccache -s

          make -j${NPROC} \\\n            ARCH=${KERNEL_ARCH} \\\n            ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} \\\n            CC="ccache gcc" \\\n            LOCALVERSION=-${{ inputs.flavour }} \\\n            KDEB_PKGVERSION=${{ inputs.kernel_version }}-1 \\\n            deb-pkg

          echo ""
          echo "ccache stats after build:"
          ccache -s
        timeout-minutes: 300

      - name: Collect build artifacts
        run: |
          cd linux-src
          ARTIFACT_DIR="${{ github.workspace }}/artifacts"
          mkdir -p ${ARTIFACT_DIR}

          # Copy .deb packages
          find .. -maxdepth 1 -name "*.deb" -exec cp {} ${ARTIFACT_DIR}/ \;

          # Copy kernel images
          if [ -f arch/${KERNEL_ARCH}/boot/bzImage ]; then
            cp arch/${KERNEL_ARCH}/boot/bzImage ${ARTIFACT_DIR}/
          fi
          if [ -f arch/${KERNEL_ARCH}/boot/Image ]; then
            cp arch/${KERNEL_ARCH}/boot/Image ${ARTIFACT_DIR}/
          fi
          if [ -f vmlinux ]; then
            xz -z -k -T0 vmlinux
            cp vmlinux.xz ${ARTIFACT_DIR}/
          fi

          # Copy kernel config
          cp .config ${ARTIFACT_DIR}/config-${{ inputs.kernel_version }}-${{ inputs.flavour }}

          # Create modules archive
          make ARCH=${KERNEL_ARCH} ${CROSS_COMPILE:+CROSS_COMPILE=$CROSS_COMPILE} \\
            INSTALL_MOD_PATH=${ARTIFACT_DIR}/modules modules_install
          cd ${ARTIFACT_DIR}/modules
          tar cJf ../modules-${{ inputs.kernel_version }}-${{ inputs.flavour }}-${{ inputs.arch }}.tar.xz .
          cd ${ARTIFACT_DIR}
          rm -rf modules

          echo "=== Build Artifacts ==="
          ls -lh ${ARTIFACT_DIR}/

      - name: Save ccache
        if: always()
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.arch }}-${{ inputs.distro }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}-${{ github.run_id }}

      - name: Generate release tag
        id: tag
        run: |
          DATE=$(date +%Y%m%d-%H%M%S)
          TAG="kernel-${{ inputs.arch }}-${{ inputs.distro }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}-${DATE}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Debian Kernel ${{ inputs.kernel_version }} (${{ inputs.flavour }}) for ${{ inputs.arch }} - ${{ inputs.distro }}"
          body: |
            ## Debian Linux Kernel Build

            | Parameter | Value |
            |-----------|-------|
            | Architecture | ${{ inputs.arch }} |
            | Distribution | ${{ inputs.distro }} |
            | Branch | ${{ inputs.branch }} |
            | Kernel Version | ${{ inputs.kernel_version }} |
            | Flavour | ${{ inputs.flavour }} |

            ### Build Info
            - Built with ccache (cache key: `ccache-${{ inputs.arch }}-${{ inputs.distro }}-${{ inputs.kernel_version }}-${{ inputs.flavour }}-*`)
            - Debug info disabled (`CONFIG_DEBUG_INFO_NONE=y`)
            - Parallel compilation with `-j$(nproc)`
            - Source: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux

            ### Artifacts
            - `*.deb` — Debian kernel packages
            - `bzImage` / `Image` — Kernel boot image
            - `vmlinux.xz` — Compressed kernel ELF (for debugging)
            - `modules-*.tar.xz` — Kernel modules
            - `config-*` — Kernel configuration file
          files: artifacts/*
          draft: false
          prerelease: ${{ inputs.branch != 'stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
